node: mech
broker: ${PEAK_BROKER}
i2c_address: 0x40
servo_hz: 50
# GeekServo 9g 270° — pulse range tuned on the bench; adjust min/max until 0° and 270° are hit cleanly
pulse_us: [500, 2500]
actuation_range: 270
servos:
  head:           { ch: 0, min: 30, max: 150, rest: 90 }
  waist:          { ch: 1, min: 45, max: 135, rest: 90 }
  left_shoulder:  { ch: 2, min: 20, max: 160, rest: 90 }
  left_elbow:     { ch: 3, min: 40, max: 140, rest: 90 }
  right_shoulder: { ch: 4, min: 20, max: 160, rest: 90 }
  right_elbow:    { ch: 5, min: 40, max: 140, rest: 90 }
# BCM GPIO numbers. HC-SR04+ runs from 3.3 V so its echo is safe for the Pi; the PIR is an HC-SR501.
sensors:
  ultrasonic: { trig: 23, echo: 24 }
  pir: { out: 17 }
# 0.96 inch SSD1306 OLED; shows the eyes (eyes.py) and their reflexes (screen.py). eye_* are pixels, RoboEyes'
# defaults. strain: false stops bad power showing as tired eyes and sweat. talk_delay_s: how long after a line
# arrives the voice starts, so the eyes pulse with it (the HomePod takes about 2.5 s).
display: { i2c_address: 0x3C, eye_width: 36, eye_height: 36, eye_radius: 8, eye_space: 10, strain: true, talk_delay_s: 2.5 }
sense_interval_s: 0.5
