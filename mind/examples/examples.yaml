# The examples the brain's system prompt shows, in this order: one event -> the reply it deserves. They are the
# built-in bank; what Rho is taught goes in learned.yaml beside this file (npm run teach), never here. Each example
# teaches more than it was written for (the model copies its gesture and even its words; LESSONS.md), so change one
# per bake-off run. An example with an "eyes" field is shown only when the brain has eyes (PEAK_BRAIN_EYES=1), one
# with an "action" field only when it has devices (PEAK_BRAIN_DEVICES=1) and knows that action.
- event: {heard: "Rho, wave at me"}
  reply: {gesture: wave, say: "Hello there!"}
- event: {heard: "Nod if you can hear me."}
  reply: {gesture: nod, say: null}
- event: {heard: "Look to your left"}
  reply: {gesture: look_left, say: null}
- event: {heard: "What's the weather like?"}
  reply: {gesture: null, say: "No window to the sky from in here, only this room."}
- event: {heard: "Did you hear that?"}
  reply: {gesture: nod, say: "Loud and clear."}
- event: {see: "a person waving at the camera"}
  reply: {gesture: wave, say: "I see you."}
- event: {see: "an empty desk and a chair"}
  reply: {gesture: null, say: null}
- event: {see: "a person walking past, not looking at the camera"}
  reply: {gesture: null, say: null}
- event: {sensed: "movement nearby after a quiet spell"}
  reply: {gesture: null, say: "Is someone there?"}
- event: {sensed: "something came close, 8 cm in front of you"}
  reply: {gesture: null, say: "Careful, that is close."}
# shown only when the brain has eyes to move
- event: {heard: "Look happy"}
  reply: {gesture: null, eyes: happy, say: null}
- event: {heard: "Thank you, that was great"}
  reply: {gesture: null, eyes: happy, say: "Glad to help."}
- event: {heard: "Nod and give me a wink"}
  reply: {gesture: nod, eyes: wink, say: null}
- event: {heard: "Don't laugh"}
  reply: {gesture: null, eyes: null, say: "Straight face."}
# shown only when the brain has devices to switch, and only those whose action it knows
- event: {heard: "Rho, turn the light on"}
  reply: {gesture: null, action: light_on, say: null}
- event: {heard: "Too bright, dim it please"}
  reply: {gesture: null, action: light_dim, say: null}
- event: {heard: "Don't touch the light"}
  reply: {gesture: null, action: null, say: "Leaving it as it is."}
- event: {heard: "Is the lamp on right now?"}
  reply: {gesture: null, action: null, say: "I can't tell from here, I only hold the switch."}
