# Devices: things in the room the hive can switch. Each is a node on the broker like a body, with no senses and
# no gestures: its own firmware says which topics it listens on, and this file maps the brain's actions onto them.
#   describe: what the brain is told the device is (one line)
#   base:     the topic prefix the firmware uses; every topic below sits under it
#   status:   topic under base whose retained payload is "online" or "offline" (set by the firmware's Last Will);
#             default "status", the hive's own convention
#   actions:  what the brain may ask for. Each has describe (one line, for the brain), topic (under base) and
#             payload (a string sent as is, or an object sent as JSON). Names share one namespace with gestures
#             and tricks, because the brain names any of them in one word.
# A new device is a new entry here; nothing else changes. Its firmware and wiring live in devices/<name>/ at the
# repo root. The desk light is an ESPHome node (devices/desk-light/light.yaml); its one light takes ESPHome's MQTT
# JSON: state ON/OFF, brightness 0 to 255, color_temp in mireds 153 (cool) to 370 (warm). The bar has 16 levels, so
# "brighter" and "dimmer" are presets.
desk_light:
  describe: 'the desk light, a Xiaomi light bar above the monitor; an ESP32 acts as its remote.'
  # ESPHome node: peak/desk-light/status is its birth and will, the light answers on light/bar/command
  base: peak/desk-light
  status: status
  actions:
    light_on:
      describe: 'switch the desk light on. For "lights on", "turn on the lamp", or when someone says it is dark.'
      topic: light/bar/command
      payload: { state: 'ON' }
    light_off:
      describe: 'switch the desk light off. For "lights off", "kill the light", "turn off the lamp".'
      topic: light/bar/command
      payload: { state: 'OFF' }
    light_bright:
      describe: 'desk light to full brightness. For "brighter", "more light", "I cannot see".'
      topic: light/bar/command
      payload: { state: 'ON', brightness: 255 }
    light_dim:
      describe: 'desk light down low. For "dim it", "too bright", "softer", "turn it down".'
      topic: light/bar/command
      payload: { state: 'ON', brightness: 51 }
    light_warm:
      describe: 'desk light to warm white. For "warmer", "cosier", "less harsh", "evening light".'
      topic: light/bar/command
      payload: { state: 'ON', color_temp: 370 }
    light_cool:
      describe: 'desk light to cool white. For "cooler", "whiter", "daylight", "crisper".'
      topic: light/bar/command
      payload: { state: 'ON', color_temp: 154 }  # the component's range is 153.8 to 370.4 mireds
