# Rho's broker with logins (docs/broker.md). scripts/broker-auth.sh on installs this as
# /opt/homebrew/etc/mosquitto/mosquitto.conf; scripts/broker-auth.sh off puts broker/mosquitto.anonymous.conf back.
listener 1883 0.0.0.0
allow_anonymous false
password_file /opt/homebrew/etc/mosquitto/passwd
acl_file /opt/homebrew/etc/mosquitto/peak.acl
# retained messages (every part's online/offline, the light's state) survive a broker restart
persistence true
persistence_location /opt/homebrew/var/lib/mosquitto/
